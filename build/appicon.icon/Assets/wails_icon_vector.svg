<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <!-- Deep Space Dark Gradient Fill -->
    <linearGradient id="keplerSpaceGrad" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Subtle Radial Nebula Glow behind the core icon -->
    <radialGradient id="keplerNebulaGlow" cx="54" cy="54" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.21" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="keplerCoreGlow" cx="54" cy="54" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Space Background -->
  <rect width="108" height="108" rx="24" fill="url(#keplerSpaceGrad)" />

  <!-- Subtle Radial Nebula Glow -->
  <path d="M54,18 A36,36 0 1,0 54,90 A36,36 0 1,0 54,18 Z" fill="url(#keplerNebulaGlow)" />

  <!-- Celestial Coordinate / Grid Rings -->
  <path d="M54,14 A40,40 0 1,0 54,94 A40,40 0 1,0 54,14 Z" fill="none" stroke="#818cf8" stroke-opacity="0.12" stroke-width="0.5" />
  <path d="M54,26 A28,28 0 1,0 54,82 A28,28 0 1,0 54,26 Z" fill="none" stroke="#818cf8" stroke-opacity="0.18" stroke-width="0.75" />

  <!-- Kepler Elliptical Celestial Orbits -->
  <ellipse cx="54" cy="54" rx="34" ry="20" transform="rotate(-28 54 54)" fill="none" stroke="#818cf8" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="2 2" />
  <ellipse cx="54" cy="54" rx="34" ry="20" transform="rotate(32 54 54)" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1" />

  <!-- Center Core -->
  <circle cx="54" cy="54" r="12" fill="url(#keplerCoreGlow)" />
  <circle cx="54" cy="54" r="5" fill="#e0e7ff" />

  <!-- Orbiting Celestial Body -->
  <circle cx="78" cy="40" r="3" fill="#38bdf8" />
  <circle cx="78" cy="40" r="5" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="0.75" />
</svg>
